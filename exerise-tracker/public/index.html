<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rep Ledger</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rep Ledger">
<meta name="theme-color" content="#EDEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: single column ledger (max 720px), sticky top bar, fixed bottom tabs; cards are workout stations. */
:root {
  --bg: #EDEFEA;
  --surface: #FFFFFF;
  --surface-2: #E2E6DF;
  --ink: #161A17;
  --muted: #5B635D;
  --line: #D1D6CF;
  --accent: #2443C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCE2FA;
  --done: #1C7448;
  --done-ink: #FFFFFF;
  --done-soft: #D6EBDD;
  --danger: #B3311F;
  --ph-warmup: #C07A1E;
  --ph-strength: #2443C9;
  --ph-cooldown: #26807F;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.05);
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111412; --surface: #1A1E1B; --surface-2: #242925; --ink: #E7EBE7; --muted: #99A29C; --line: #2E3430;
    --accent: #8197FF; --accent-ink: #0B1030; --accent-soft: #222A50; --done: #5BC48D; --done-ink: #08200F; --done-soft: #17321F;
    --danger: #F07A68; --ph-warmup: #E2A04A; --ph-strength: #8197FF; --ph-cooldown: #57C2C0;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --surface: #1A1E1B; --surface-2: #242925; --ink: #E7EBE7; --muted: #99A29C; --line: #2E3430;
  --accent: #8197FF; --accent-ink: #0B1030; --accent-soft: #222A50; --done: #5BC48D; --done-ink: #08200F; --done-soft: #17321F;
  --danger: #F07A68; --ph-warmup: #E2A04A; --ph-strength: #8197FF; --ph-cooldown: #57C2C0;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); color-scheme: light; }
html, body { background: var(--bg); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in, .wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 0; text-align: right; }
.sync.warn { color: var(--danger); }
.sync.warn i { background: var(--danger); }
.sync i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--done); }

main.wrap { padding-block: 18px 120px; display: flex; flex-direction: column; gap: 22px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
.tab { background: none; border: 0; padding: 12px 8px 14px; font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 3px solid transparent; }
.tab[aria-current="page"] { color: var(--ink); border-top-color: var(--accent); }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.h1 { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; gap: 8px; }
.h2 .count { font-variant-numeric: tabular-nums; color: var(--ink); }
.sub { color: var(--muted); margin: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; justify-content: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.go { background: var(--done); color: var(--done-ink); border-color: var(--done); }
.btn.big { padding: 15px 20px; font-family: var(--font-display); font-size: 21px; letter-spacing: .06em; text-transform: uppercase; border-radius: 12px; width: 100%; }
.btn.wide { width: 100%; padding: 13px 16px; font-family: var(--font-display); font-size: 19px; letter-spacing: .06em; text-transform: uppercase; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn.solid-danger { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.linkish { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 0; }

.hero { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.list > [hidden] + *, .list > *:first-child { border-top: 0; }

.rx { font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .02em; font-variant-numeric: tabular-nums; color: var(--ink); }
.meta { font-size: 13px; color: var(--muted); }
.phase-dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; flex: none; background: var(--muted); }
.ph-warmup { background: var(--ph-warmup); } .ph-strength { background: var(--ph-strength); } .ph-cooldown { background: var(--ph-cooldown); }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.goal { background: var(--done-soft); color: var(--done); }
.tag.ex { background: var(--accent-soft); color: var(--accent); }

/* Exercise rows */
.xrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.xrow-main { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.xrow-name { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; flex-wrap: wrap; }
.meter { height: 4px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin-top: 4px; max-width: 220px; display: block; }
.meter b { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.meter.full b { background: var(--done); }
.phase-head { display: flex; align-items: center; gap: 8px; padding: 9px 14px 7px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); background: var(--surface-2); }
.region-head { padding: 8px 14px 2px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.list > .region-head + .xrow { border-top: 0; }
.list > .phase-head:first-child { border-radius: var(--radius) var(--radius) 0 0; }

.grip { flex: none; width: 34px; height: 44px; margin-left: -6px; display: grid; place-items: center; border: 0; background: none; color: var(--muted); touch-action: none; cursor: grab; border-radius: 8px; }
.grip svg { width: 18px; height: 18px; }
.grip:active { cursor: grabbing; }
.xrow.dragging { position: relative; z-index: 5; background: var(--surface); box-shadow: 0 6px 20px rgba(0,0,0,.18); border-radius: 10px; }
.xrow.shifting { transition: transform .15s ease; }
.reorder-hint { font-size: 13px; color: var(--muted); margin: 0; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch input:checked + span { background: var(--done); border-color: var(--done); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Session cards */
.session-bar { display: flex; flex-direction: column; gap: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.card.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.card.logged { box-shadow: none; gap: 8px; }
.card-head { display: flex; align-items: flex-start; gap: 10px; }
.pin { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); margin-top: 2px; display: grid; place-items: center; padding: 0; }
.pin svg { width: 14px; height: 14px; opacity: 0; }
.card.now .pin { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card.now .pin svg, .card.logged .pin svg { opacity: 1; }
.card.logged .pin { background: var(--done); border-color: var(--done); color: var(--done-ink); }
.card-title { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.card-title h3 { font-family: var(--font-display); font-weight: 700; font-size: 23px; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.icon-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; }
.icon-btn svg { width: 20px; height: 20px; }
.menu-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px; border-radius: 10px; background: var(--surface-2); }
.last { font-size: 13px; color: var(--muted); display: flex; gap: 4px 14px; flex-wrap: wrap; }
.last b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

.log { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 10px; }
.log-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.seg.mini button { padding: 4px 10px; font-size: 12px; }
.did { display: flex; gap: 6px; flex-wrap: wrap; align-items: stretch; }
.vcol { width: 52px; display: flex; flex-direction: column; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.vcol.wt { width: 64px; background: var(--surface-2); }
.vcol button { width: 100%; height: 28px; border: 0; background: none; color: var(--accent); font-size: 18px; font-weight: 600; line-height: 1; padding: 0; }
.vcol .v { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.vcol .u { font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.vcol.off { border-color: var(--accent); }
.vcol.off .v { color: var(--accent); }
.vcol.zero .v, .vcol.zero .u { opacity: .45; }
.vcol.add { border-style: dashed; justify-content: center; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; padding: 0; background: none; }
.did .sep { width: 1px; background: var(--line); margin: 4px 2px; }
.lvl-select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; max-width: 100%; font-size: 14px; }
.next-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.next-row .field-label { flex: none; }
.btn.log-btn { width: 100%; padding: 11px 16px; font-family: var(--font-display); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.step-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.step-label i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); display: inline-grid; place-items: center; font-size: 11px; }
.step-label .opt { font-weight: 500; text-transform: none; letter-spacing: 0; }
.setrows { display: flex; flex-direction: column; gap: 6px; }
.setrow { display: flex; align-items: center; gap: 10px; }
.setrow .lbl { width: 46px; font-size: 13px; font-weight: 600; color: var(--muted); flex: none; }
.setrow .x { width: 32px; height: 32px; }
.stepper { display: inline-flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.stepper button { width: 40px; height: 40px; border: 0; background: none; font-size: 22px; font-weight: 600; color: var(--accent); }
.stepper .v { min-width: 70px; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }
.stepper .v small { font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--muted); margin-left: 3px; }
.stepper.off .v { color: var(--accent); }
.diffrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.diffrow select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; max-width: 100%; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 13px; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg button.sugg { border-color: var(--accent); color: var(--accent); }
.seg button.sugg[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.summary { font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.summary b { font-family: var(--font-display); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

/* Rich notes */
.md { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; }
.md p { margin: 0; }
.md p + p, .md ul + p, .md ol + p, .md p + ul, .md p + ol { margin-top: 4px; }
.md ul, .md ol { margin: 0; padding-left: 20px; }
.md li + li { margin-top: 2px; }
.md strong { font-weight: 700; }
.notes-view { background: none; border: 0; padding: 8px 10px; text-align: left; border-radius: 10px; border: 1px dashed transparent; width: 100%; color: var(--ink); }
.notes-view:hover { border-color: var(--line); }
.notes-view.empty { color: var(--muted); border-color: var(--line); }
.md-edit { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.md-edit:focus-within { border-color: var(--accent); }
.md-tools { display: flex; gap: 2px; padding: 4px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.md-tools button { border: 0; background: none; border-radius: 6px; padding: 5px 10px; font-size: 13px; font-weight: 600; color: var(--ink); }
.md-tools button:hover { background: var(--surface); }
.md-tools .spacer { flex: 1; }
.rich { display: block; width: 100%; padding: 9px 11px; min-height: 84px; font-size: 14px; line-height: 1.45; outline: none; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
.rich:empty::before { content: attr(data-ph); color: var(--muted); pointer-events: none; }
.rich ul, .rich ol { margin: 0; padding-left: 22px; }
.rich ul { list-style: disc; }
.rich p, .rich div { margin: 0; }
.rich li + li { margin-top: 2px; }

/* History */
.hist { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.hist-head { display: flex; justify-content: space-between; gap: 10px; width: 100%; background: none; border: 0; padding: 0; text-align: left; }
.hist-head b { font-weight: 600; }
.hist-items { display: flex; flex-direction: column; gap: 4px; font-size: 13px; padding-top: 4px; }
.hist-items div { display: flex; justify-content: space-between; gap: 12px; }
.hist-items span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }

.banner { background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.filters .lab { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 54px; flex: none; }
.filter-block { display: flex; flex-direction: column; gap: 8px; }
.subfilters { display: flex; gap: 6px; flex-wrap: wrap; padding-left: 60px; }
@media (max-width: 420px) { .filters .lab { width: 100%; } .subfilters { padding-left: 0; } }
.search { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgba(10,14,12,.45); z-index: 40; }
.sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 92%; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
@media (min-width: 760px) {
  .sheet { left: 50%; right: auto; top: 50%; bottom: auto; transform: translate(-50%, -50%); width: 620px; max-height: 88%; border-radius: 18px; }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; }
.sheet-body { overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.sheet-foot { padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.sheet-foot .btn { flex: 1; }
.fgroup { display: flex; flex-direction: column; gap: 8px; }
.fgroup > .field-label { display: flex; justify-content: space-between; gap: 10px; }
.field-label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f input, .f select, .name-input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.f input { font-variant-numeric: tabular-nums; }
.name-input { font-family: var(--font-display); font-weight: 700; font-size: 24px; text-transform: uppercase; letter-spacing: .02em; padding: 8px 12px; }
.inline-switch { display: flex; align-items: center; gap: 10px; font-weight: 600; }

const ICON = {

  up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',

/* ---------- state ---------- */
const S = { exercises: {}, sessions: {}, loaded: false, mode: 'connecting', view: 'workout', sheet: null, menu: null, openHist: null, confirm: null,
  phaseFilter: 'all', fRegion: 'all', fGroup: null, fMuscle: null, search: '', editNote: null };

/* ---------- storage: your GitHub data repo, through /api on this site ---------- */
const CACHE_KEY = 'rl-cache-v2', OUTBOX_KEY = 'rl-outbox-v2', ACTIVE_KEY = 'rl-active-v2';
const ls = {

const localDate = (ts) => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const yearOf = (ts) => new Date(ts).getFullYear();
function exPathFor(ex) {

  const plain = 'exercises/' + base + '.md', alt = 'exercises/' + base + '-' + String(ex.id).slice(0, 6) + '.md';

function saveOutbox() { ls.set(OUTBOX_KEY, outbox); }

  },

async function readJson(res) {

/* ---------- normalizing older records ---------- */
const MUSCLE_RENAME = { back: 'upper back', core: 'anti-extension', abs: 'anti-extension', obliques: 'anti-rotation', hips: 'hip flexors' };

  s += '<text x="' + (W - pr) + '" y="13" text-anchor="end" font-size="12" font-weight="700" fill="var(--ink)">' + esc(fmt(lp)) + '</text>';
  s += '<text x="' + pl + '" y="' + (H - 3) + '" font-size="10.5" fill="var(--muted)">' + esc(DAY.format(new Date(pts[0].t))) + '</text>';

function sheetAdd() {

/* ---------- actions ---------- */
function blankExercise() {
  return { id: uid(), name: '', muscles: [], phase: 'strength', active: true, notes: '', volume: 'reps', difficulty: 'weight', sets: 2,
    cur: { reps: 8, weight: 0, time: 30, level: 0 }, goal: { reps: 12, weight: 0, time: 60, level: 0 }, levels: [], step: 5, unit: 'lb', createdAt: Date.now() };
}
function openEdit(id, opts) {
  flushSave(); flushNotes();
  const ex = id ? S.exercises[id] : null;
  const d = ex ? normEx(clone(ex)) : blankExercise();
  S.sheet = { kind: 'edit', draft: d, isNew: !ex, addToSession: !!(opts && opts.addToSession) };
  S.confirm = null; S.menu = null; S.editNote = null;
  render();
}
let saveT = null;
function scheduleSave(now) { clearTimeout(saveT); if (now) flushSave(); else saveT = setTimeout(flushSave, 500); }
function flushSave() {
  clearTimeout(saveT); saveT = null;
  const sh = S.sheet; if (!sh || sh.kind !== 'edit' || sh.isNew || !S.exercises[sh.draft.id]) return;
  if (JSON.stringify(S.exercises[sh.draft.id]) !== JSON.stringify(sh.draft)) Store.saveExercise(clone(sh.draft));
}

function setPath(o, path, v) { const p = path.split('.'); let t = o; for (let i = 0; i < p.length - 1; i++) t = t[p[i]]; t[p[p.length - 1]] = v; }

  d.cur.level = Math.max(0, Math.min(d.cur.level || 0, Math.max(0, n - 1)));
  d.goal.level = Math.max(0, Math.min(d.goal.level || 0, Math.max(0, n - 1)));
  d.sets = Math.max(1, Math.min(20, d.sets || 1));
}
const saveSess = (s) => Store.saveSession(s);

const noteTimers = {}, noteDraft = {};
function onNote(exId, val) {
  if (!S.exercises[exId]) return;
  noteDraft[exId] = val;
  clearTimeout(noteTimers[exId]);
  noteTimers[exId] = setTimeout(() => commitNote(exId), 600);
}
function commitNote(exId) {
  clearTimeout(noteTimers[exId]);
  const e = S.exercises[exId];
  if (e && exId in noteDraft) { if (e.notes !== noteDraft[exId]) { e.notes = noteDraft[exId]; Store.saveExercise(clone(e)); } }
  delete noteDraft[exId];
}
function flushNotes() { Object.keys(noteDraft).forEach(commitNote); }

let wakeLock = null;
async function keepAwake() { try { if (navigator.wakeLock && !wakeLock && activeSession()) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { wakeLock = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
function tickElapsed() { document.querySelectorAll('[data-elapsed]').forEach((el) => { const m = Math.max(0, Math.floor((Date.now() - +el.dataset.elapsed) / 60000)); el.textContent = m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }); }
setInterval(tickElapsed, 30000);

/* ---------- drag to reorder ---------- */
let drag = null;
function groupRows(row) { return [...row.parentElement.querySelectorAll('.xrow[data-gkey="' + CSS.escape(row.dataset.gkey) + '"]')]; }
function commitOrder(ids) {
  ids.forEach((id, i) => { const e = S.exercises[id]; const o = (i + 1) * 10; if (e && e.order !== o) { e.order = o; Store.saveExercise(clone(e)); } });
}
function dragMove() {
  if (!drag) return;
  const pageY = drag.clientY + window.scrollY;
  const { rects, from } = drag, n = rects.length;
  const dy = Math.max(rects[0].top - rects[from].top, Math.min(rects[n - 1].bottom - rects[from].bottom, pageY - drag.y0));
  drag.row.style.transform = 'translateY(' + dy + 'px)';
  const center = rects[from].top + rects[from].height / 2 + (pageY - drag.y0); // unclamped, so dragging past either end picks the end slot
  let to = from;
  for (let i = 0; i < from; i++) if (center < rects[i].top + rects[i].height / 2) { to = i; break; }
  if (to === from) for (let i = n - 1; i > from; i--) if (center > rects[i].top + rects[i].height / 2) { to = i; break; }
  drag.to = to;
  const hgt = rects[from].height;
  drag.sibs.forEach((r, i) => {
    if (i === from) return;
    const shift = from < to && i > from && i <= to ? -hgt : to < from && i >= to && i < from ? hgt : 0;

}
function autoScroll() {
  if (!drag) return;

  const edge = 70, y = drag.clientY, vh = window.innerHeight;
  const v = y < edge ? -Math.ceil((edge - y) / 6) : y > vh - edge - 64 ? Math.ceil((y - (vh - edge - 64)) / 6) : 0;
  if (v) { window.scrollBy(0, v); dragMove(); }
  drag.raf = requestAnimationFrame(autoScroll);
}
function endDrag(commit) {
  if (!drag) return;
  cancelAnimationFrame(drag.raf);

  sibs.forEach((r) => { r.style.transform = ''; r.classList.remove('dragging', 'shifting'); });
  drag = null;
  if (commit && to !== from) {
    const ids = sibs.map((r) => r.dataset.id);
    const [moved] = ids.splice(from, 1); ids.splice(to, 0, moved);
    commitOrder(ids);
  }
  render();
}
document.addEventListener('pointerdown', (ev) => {
  const g = ev.target.closest('[data-grip]'); if (!g || drag) return;

document.addEventListener('keydown', (ev) => {

  const again = document.querySelector('.xrow[data-id="' + CSS.escape(row.dataset.id) + '"] [data-grip]'); if (again) again.focus();

// toolbar buttons keep focus in the textarea

document.addEventListener('click', (ev) => {
  const tool = ev.target.closest('.md-tools button');
  if (tool) { const ed = tool.closest('.md-edit').querySelector('[data-rich]'); mdCommand(ed, tool.dataset.md); return; }
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act; if (t.type === 'checkbox') return;
  const s = activeSession();
  const i = t.dataset.i != null ? +t.dataset.i : null;
  const j = t.dataset.s != null ? +t.dataset.s : null;
  const it = s && i != null ? s.items[i] : null;
  const ex = it ? S.exercises[it.exId] : null;
  const exL = it ? (ex || normEx({ id: it.exId, name: it.name, cur: it.prev })) : null;

  switch (act) {
    case 'view': S.view = t.dataset.v; S.confirm = null; S.search = ''; S.reorder = false; try { localStorage.setItem('rl-view', S.view); } catch (e) {} render(); window.scrollTo(0, 0); return;
    case 'start': {
      const list = activeEx(); if (!list.length) return;
      const sess = { id: uid(), startedAt: Date.now(), finishedAt: null, status: 'active', items: list.map(makeItem) };
      sess.items[0].now = true;
      saveSess(sess); S.view = 'workout'; S.menu = null; render(); window.scrollTo(0, 0); keepAwake(); return;
    }
    case 'pin': if (!it || it.logged) return; it.now = !it.now; saveSess(s); render(); return;
    case 'menu': S.menu = S.menu === i ? null : i; render(); return;
    case 'edit-note': S.editNote = t.dataset.id; render(); return;
    case 'feel': if (!it) return; it.feel = it.feel === t.dataset.v ? null : t.dataset.v; saveSess(s); renderKeep(t); return;
    case 'vstep': {

    }
    case 'dstep': if (!it) return; it.result.diff = +t.dataset.d > 0 ? wUp(exL, it.result.diff) : wDown(exL, it.result.diff); saveSess(s); renderKeep(t); return;
    case 'set-add': if (!it) return; it.result.vols.push(it.result.vols[it.result.vols.length - 1] ?? it.target.vol); saveSess(s); renderKeep(t); return;
    case 'set-del': if (!it || it.result.vols.length < 2) return; it.result.vols.splice(j, 1); saveSess(s); render(); return;
    case 'next': if (!it) return; it.next = t.dataset.v; saveSess(s); renderKeep(t); return;

    }

      if (ex) Store.saveExercise(clone(ex));
      s.items.splice(i, 1); S.menu = null; saveSess(s); render();

    }
    case 'finish': {

    case 'cancel-confirm': S.confirm = null; render(); return;
    case 'hist': S.openHist = S.openHist === t.dataset.id ? null : t.dataset.id; S.confirm = null; render(); return;
    case 'del-session': Store.deleteSession(t.dataset.id); S.confirm = null; S.openHist = null; render(); toast('Workout deleted'); return;
    case 'pf': S.phaseFilter = t.dataset.v; render(); return;
    case 'fr': S.fRegion = t.dataset.v; S.fGroup = null; S.fMuscle = null; render(); return;
    case 'fg': S.fGroup = S.fGroup === t.dataset.v && !S.fMuscle ? null : t.dataset.v; S.fMuscle = null; render(); return;
    case 'fm': S.fMuscle = S.fMuscle === t.dataset.v ? null : t.dataset.v; render(); return;

});

    if (t.dataset.f === 'sets') clampDraft(d);

  }
});
function readField(t) {
  const d = S.sheet.draft, k = t.dataset.kind, f = t.dataset.f;
  let v = t.value;
  if (k === 'int') v = Math.max(0, parseInt(v, 10) || 0);
  else if (k === 'float') v = Math.max(0, parseFloat(v) || 0);
  else if (k === 'time') v = parseTime(v);
  setPath(d, f, v);
}
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.rich !== undefined) {
    autoList(ev);
    const v = htmlToMd(t);
    if (t.dataset.note) onNote(t.dataset.note, v);
    else if (t.dataset.f === 'notes' && S.sheet && S.sheet.kind === 'edit') { S.sheet.draft.notes = v; scheduleSave(false); }
    return;
  }
  if (t.id === 'ex-search' || t.id === 'add-search') { S.search = t.value; applySearch(); return; }
  if (t.dataset.note) { onNote(t.dataset.note, t.value); return; }
  if (t.dataset.f && S.sheet && S.sheet.kind === 'edit' && t.dataset.kind !== 'bool' && t.tagName !== 'SELECT') { readField(t); scheduleSave(false); }
});
document.addEventListener('keydown', (ev) => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'b' && ev.target.isContentEditable) { setTimeout(() => ev.target.dispatchEvent(new Event('input', { bubbles: true })), 0); }
  if (ev.key === 'Escape') { if (S.editNote) { ev.target.blur && ev.target.blur(); return; } if (S.sheet) { closeSheet(); return; } }
  if (ev.key === 'Enter' && (ev.target.id === 'new-level' || ev.target.id === 'new-muscle')) {
    ev.preventDefault(); const id = ev.target.id; const b = ev.target.parentElement.querySelector('button'); b && b.click();
    setTimeout(() => { const n = document.getElementById(id); n && n.focus(); }, 0);
  }
});

boot();
</script>
